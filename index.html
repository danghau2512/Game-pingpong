<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ping Pong</title>

    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
</head>

<body>

<div class="game-container">

    <div class="game-header">
        <h1>PING PONG</h1>
    </div>

    <div class="game-info">

        <div class="info-item">
            <span>Score</span>
            <strong id="score">0</strong>
        </div>

        <div class="info-item">
            <span>Level</span>
            <strong id="level">1</strong>
        </div>

        <div class="info-item">
            <span>Lives</span>
            <strong id="lives">
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
            </strong>
        </div>

    </div>

    <div class="level-select">
        <span>Level:</span>

        <button class="level-btn active" onclick="loadLevel(1)">1</button>
        <button class="level-btn" onclick="loadLevel(2)">2</button>
        <button class="level-btn" onclick="loadLevel(3)">3</button>
        <button class="level-btn" onclick="loadLevel(4)">4</button>
        <button class="level-btn" onclick="loadLevel(5)">5</button>
        <button class="level-btn" onclick="loadLevel(6)">6</button>
    </div>

    <div class="game-board">

        <div class="brick-container" id="brickContainer">
        </div>

        <div class="ball"></div>

        <div class="paddle"></div>
        <div class="win-message" id="winMessage">
            <h2 id="winTitle"></h2>
            <p>Chúc mừng bạn đã phá hết gạch!</p>
            <p>Nhấn R để chơi lại</p>

        </div>
        <div class="game-over-message" id="gameOverMessage">
            <h2>GAME OVER</h2>
            <p>Bạn đã hết mạng!</p>
            <p>Score: <span id="finalScore">0</span></p>
        </div>
        <div class="level-notice" id="levelNotice"></div>
    </div>

    <div class="game-control">
        <p>
            <span>← →</span>
            Di chuyển
        </p>
        <p>
            <i class="fa-solid fa-computer-mouse"></i> Chuột
        </p>
        <p>
            <span>SPACE</span>
            Bắt đầu
        </p>
        <p>
            <span>R</span>
            Chơi lại
        </p>
        <p class="grow-info" id="growInfo">
            Sinh gạch sau: <span id="growSeconds">5</span>s
        </p>
    </div>

</div>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background-color: #dfe9f3;
    }

    .game-container {
        width: 800px;
        margin: 0 auto;
    }

    .game-header {
        text-align: center;
    }

    .game-header h1 {
        margin-bottom: 5px;
    }

    .game-header p {
        margin-top: 0;
        color: #666;
    }

    .game-info {
        display: flex;
        justify-content: space-between;
        padding: 10px 20px;
        margin-bottom: 10px;
        background-color: #f4f8fc;
        border: 1px solid #b8c7d6;
    }

    .info-item {
        text-align: center;
    }

    .info-item span {
        display: block;
        font-size: 13px;
        color: #666;
    }

    .info-item strong {
        font-size: 18px;
    }

    #lives {
        color: #d62828;
    }

    .level-select {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        margin-bottom: 10px;
    }

    .level-btn {
        width: 35px;
        height: 30px;
        border: 1px solid #9aa9b8;
        background-color: #f4f8fc;
        cursor: pointer;
    }

    .level-btn:hover {
        background-color: #d9e7f2;
    }

    .level-btn.active {
        background-color: #4a90c2;
        color: white;
    }

    .game-board {
        width: 800px;
        height: 500px;
        position: relative;
        overflow: hidden;
        border: 3px solid #4f6272;
        background-color: #eef4f8;
    }

    .brick-container {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 6px;
        padding: 20px;
    }

    .brick {
        height: 28px;
        background-color: #e59b2f;
        border: 1px solid #8a5a14;
    }

    .ball {
        width: 20px;
        height: 20px;
        position: absolute;
        left: 390px;
        background-color: #e53935;
        border-radius: 50%;
        top: 410px;
    }

    .paddle {
        width: 120px;
        height: 15px;
        position: absolute;
        left: 340px;
        bottom: 30px;
        background-color: #2f5fd0;
    }

    .game-control {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-top: 10px;
    }

    .game-control p {
        margin: 0;
        font-size: 14px;
    }

    .game-control span {
        font-weight: bold;
    }
    #lives {
        color: #e53935;
    }

    #lives i {
        margin-left: 3px;
    }

    .game-control i {
        margin-right: 5px;
    }
    .win-message {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        background-color: #dfe9f3;
        border: 2px solid #4f6272;
        padding: 20px;
        z-index: 2;
    }

    .win-message h2 {
        color: #2e7d32;
        margin-top: 0;
    }
    .game-over-message {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        background-color: #dfe9f3;
        border: 2px solid #4f6272;
        padding: 20px;
        z-index: 2;
    }

    .game-over-message h2 {
        color: #d62828;
        margin-top: 0;
    }
    .level-notice {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px;
        background-color: #dfe9f3;
        border: 1px solid #4f6272;
        text-align: center;
    }
    .brick.normal-brick {
        background-color: gray;
    }

    .brick.key-brick {
        background-color: yellow;
    }

    .brick.lock-brick {
        background-color: indianred;
    }

    .brick.key-brick,
    .brick.lock-brick {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
    }
    .brick.lock-brick.unlocked,
    .brick.normal-brick.unlocked {
        background-color: #e59b2f;
    }
    .brick.mother-brick {
        background-color: green;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 16px;
    }
    .brick.child-brick {
        background-color: lightgreen;
    }
    .grow-info {
        display: none;
    }
    .brick.level4-normal {
        background-color: #e59b2f;
    }

    .brick.bomb-brick {
        background-color: indianred;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
    }

    .brick.stone-brick {
        background-color: gray;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
    }
    .bomb-explosion {
        position: absolute;
        width: 35px;
        height: 35px;
        background-color: rgba(255, 180, 0, 0.8);
        border: 2px solid #ff6238;
        border-radius: 50%;
        pointer-events: none;
        z-index: 10;
        animation: bombFlash 0.35s ease-out forwards;
    }
    @keyframes bombFlash {
        from {
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 1;
        }
        to {
            transform: translate(-50%, -50%) scale(2.5);
            opacity: 0;
        }
    }
</style>
<script src="game.js"></script>
</body>

</html>
