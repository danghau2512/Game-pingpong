<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ping Pong</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
</head>

<body>

<div class="game-container">

    <div class="game-header">
        <h1>PING PONG</h1>
    </div>

    <div class="game-info">

        <div class="info-item">
            <span>Score</span>
            <strong id="score">0</strong>
        </div>

        <div class="info-item">
            <span>Level</span>
            <strong id="level">1</strong>
        </div>

        <div class="info-item">
            <span>Lives</span>
            <strong id="lives">
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
            </strong>
        </div>

    </div>

    <div class="level-select">
        <span>Level:</span>

        <button class="level-btn active">1</button>
        <button class="level-btn">2</button>
        <button class="level-btn">3</button>
        <button class="level-btn">4</button>
        <button class="level-btn">5</button>
        <button class="level-btn">6</button>
    </div>

    <div class="game-board">

        <div class="brick-container" id="brickContainer">
        </div>

        <div class="ball"></div>

        <div class="paddle"></div>
        <div class="win-message" id="winMessage">
            <h2>HOÀN THÀNH LEVEL 1!</h2>
            <p>Chúc mừng bạn đã phá hết gạch!</p>
        </div>
    </div>

    <div class="game-control">
        <p>
            <span>← →</span>
            Di chuyển
        </p>
        <p>
            <i class="fa-solid fa-computer-mouse"></i> Chuột
        </p>
        <p>
            <span>SPACE</span>
            Bắt đầu
        </p>
    </div>

</div>

<script src="js/game.js"></script>

</body>

</html>
